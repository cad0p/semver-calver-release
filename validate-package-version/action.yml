name: 'Validate Package Version'
description: 'On normal PRs, reject package.json version changes and any CHANGELOG.md edits; on release/from-v* branches, validate version format only'

inputs:
  base-branch:
    description: 'Branch to compare package.json version against'
    required: false
    default: 'main'

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Validate package version
      shell: bash
      run: |
        BRANCH="${{ github.head_ref || github.ref_name }}"
        BASE_BRANCH="${{ inputs.base-branch }}"

        if [ -z "$BRANCH" ]; then
          echo "::error::Unable to determine branch name. This action is designed for pull_request or push events."
          exit 1
        fi

        if [ ! -f package.json ]; then
          echo "::error::package.json not found in the workspace"
          exit 1
        fi

        CURRENT_VERSION=$(jq -r '.version // empty' package.json)
        if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" = "null" ]; then
          echo "::error::package.json is missing a 'version' field"
          exit 1
        fi

        echo "Current version: $CURRENT_VERSION"
        echo "Branch: $BRANCH"

        # Base SemVer: MAJOR.MINOR.PATCH
        # Prerelease: MAJOR.MINOR.PATCH-YYYYMMDD.N (for same-day releases)
        if ! echo "$CURRENT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]{8}\.[0-9]+)?$'; then
          echo "::error::Version '$CURRENT_VERSION' is not valid (expected MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-YYYYMMDD.N, e.g. 1.0.0, 1.0.0-20260429.0)"
          exit 1
        fi

        # On release branches: format check only (version bump is allowed and expected)
        if echo "$BRANCH" | grep -q '^release/from-v'; then
          echo "Release branch — version format OK: $CURRENT_VERSION"
          exit 0
        fi

        # On non-release branches: version must not change from base branch
        BASE_VERSION=$(git show "origin/$BASE_BRANCH:package.json" 2>/dev/null | jq -r '.version // empty' || echo "")
        if [ -z "$BASE_VERSION" ]; then
          echo "::error::Could not read version from origin/$BASE_BRANCH:package.json"
          exit 1
        fi

        if [ "$CURRENT_VERSION" != "$BASE_VERSION" ]; then
          {
            echo "## ❌ package.json version changed on a non-release branch"
            echo ""
            echo "**Rule:** \`package.json\` \`version\` may only change on \`release/from-v*\` branches (found: \`$BASE_VERSION\` → \`$CURRENT_VERSION\`). Version bumps are how the release action detects a curated base release; a bump on a feature branch corrupts that signal."
            echo ""
            echo "**Fix this PR:**"
            echo '```bash'
            echo "git checkout origin/$BASE_BRANCH -- package.json"
            echo "git commit -m \"chore: revert version bump (releases bump version on the release PR)\""
            echo "git push"
            echo '```'
            echo ""
            echo "**To cut a release:** find the draft PR on the \`release/from-v$BASE_VERSION\` branch → curate CHANGELOG.md (between the \`USER-EDITABLE SECTION\` markers) → bump \`package.json\` there → merge. Merging tags the base release and updates the floating tags."
            echo ""
            echo "Docs: https://github.com/cad0p/semver-calver-release#base-releases-manual-curated"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::package.json version changed from '$BASE_VERSION' to '$CURRENT_VERSION' on a non-release branch — fix runbook above and in the job summary"
          exit 1
        fi

        echo "Version unchanged from $BASE_BRANCH: $CURRENT_VERSION"

        # On non-release branches: CHANGELOG.md must not change.
        # Changelog edits (including historical typo fixes) belong on the
        # release/from-v* branch / draft release PR. This prevents normal PRs
        # from contaminating main's CHANGELOG.md, which the release action
        # treats as the source of truth for finalized sections.
        if git diff --name-only "origin/$BASE_BRANCH...HEAD" -- CHANGELOG.md | grep -qx 'CHANGELOG.md'; then
          {
            echo "## ❌ CHANGELOG.md modified on a non-release branch"
            echo ""
            echo "**Rule:** Changelog edits — including typo fixes to historical entries — belong on the \`release/from-v*\` draft release PR. The release action treats main's CHANGELOG.md as the source of truth for finalized sections, so a normal PR landing changelog edits (or premature release headings) corrupts the next release's notes."
            echo ""
            echo "**Fix this PR:**"
            echo '```bash'
            echo "git checkout origin/$BASE_BRANCH -- CHANGELOG.md"
            echo "git commit -m \"chore: revert CHANGELOG edit (curation happens on the release PR)\""
            echo "git push"
            echo '```'
            echo "Carry your changelog text over to the draft release PR instead of losing it."
            echo ""
            echo "**To cut a release:** find the draft PR on the \`release/from-v$BASE_VERSION\` branch → paste your notes into CHANGELOG.md between the \`USER-EDITABLE SECTION\` markers → bump \`package.json\` → mark ready → merge. The heading date and PR title are set automatically. If checks sit at \`action_required\` after the bot commit, approve the workflow runs (\`gh api -X POST /repos/{owner}/{repo}/actions/runs/<id>/approve\`)."
            echo ""
            echo "Docs: https://github.com/cad0p/semver-calver-release#base-releases-manual-curated"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::CHANGELOG.md must not be modified on non-release branches — fix runbook above and in the job summary"
          exit 1
        fi
