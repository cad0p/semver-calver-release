name: 'Validate Release PR'
description: 'Ensure package.json version is bumped before merging a release PR, and update PR title'

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Validate version bump and update PR title
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        BRANCH="${{ github.head_ref }}"
        
        # Only validate release/* branches
        if ! echo "$BRANCH" | grep -q '^release/from-v'; then
          echo "Not a release branch — skipping validation"
          exit 0
        fi
        
        CURRENT_VERSION=$(jq -r '.version' package.json)
        
        # Get the last released base version from main's package.json
        MAIN_VERSION=$(git show origin/main:package.json 2>/dev/null | jq -r '.version' || echo "0.0.0")
        MAIN_BASE=$(echo "$MAIN_VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
        
        echo "Last released base version: $MAIN_BASE"
        echo "Current version: $CURRENT_VERSION"
        
        if [ "$CURRENT_VERSION" = "$MAIN_BASE" ]; then
          {
            echo "## ❌ Release PR without a version bump"
            echo ""
            echo "**Rule:** A release PR must bump \`package.json\` \`version\` above the last released base version ($MAIN_BASE). The bump is what turns the accumulating draft into a curated base release."
            echo ""
            echo "**Fix this PR:**"
            echo '```bash'
            echo "git checkout $BRANCH"
            echo "# edit package.json: bump \"version\" above $MAIN_BASE (e.g. next patch)"
            echo "# curate CHANGELOG.md between the USER-EDITABLE SECTION markers while you're here"
            echo "git commit -m \"chore(release): v<version> — curate changelog and bump version\""
            echo "git push"
            echo '```'
            echo "The PR title and the CHANGELOG heading date update automatically on push. Checks stuck at \`action_required\` after the bot commit? Approve the runs: \`gh api -X POST /repos/{owner}/{repo}/actions/runs/<id>/approve\`."
            echo ""
            echo "Docs: https://github.com/cad0p/semver-calver-release#base-releases-manual-curated"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::package.json version ($CURRENT_VERSION) must be bumped from the last released base version ($MAIN_BASE) — fix runbook above and in the job summary"
          exit 1
        fi
        
        echo "Version bumped: $MAIN_BASE → $CURRENT_VERSION"
        
        # Validate CHANGELOG.md has a dated heading for the release
        if [ -f CHANGELOG.md ]; then
          TOP_HEADING=$(awk '/^## \[/ { print; exit }' CHANGELOG.md)
          if ! echo "$TOP_HEADING" | grep -qE "^## \[$CURRENT_VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}"; then
            echo "::error::CHANGELOG.md top section is missing a release date"
            echo "::error::Expected: ## [$CURRENT_VERSION] - YYYY-MM-DD"
            echo "::error::Found: $TOP_HEADING"
            echo "::error::Mark this PR as 'Ready for review' to automatically add the date, or add it manually"
            exit 1
          fi
        fi
        
        # Prevent code changes from being hidden in release PRs
        UNEXPECTED=$(git diff --name-only origin/main...HEAD | grep -v -E '^(package\.json|package-lock\.json|yarn\.lock|pnpm-lock\.yaml|CHANGELOG\.md)$' || true)
        if [ -n "$UNEXPECTED" ]; then
          {
            echo "## ❌ Release PR contains unexpected files"
            echo ""
            echo "**Rule:** Release branches may only change \`package.json\`, lockfiles, and \`CHANGELOG.md\` — a release PR is a curated version bump, not a vehicle for code changes. Found:"
            echo '```'
            echo "$UNEXPECTED"
            echo '```'
            echo ""
            echo "**Fix this PR:** move those changes to their own feature branch / PR and merge them to main first; the release branch picks them up automatically when the action rebuilds it from \`origin/main\`."
            echo '```bash'
            echo "git checkout $BRANCH"
            echo "git checkout origin/main -- <file>   # per unexpected file, to revert it here"
            echo "git commit -m \"chore: drop non-release files (moved to a feature PR)\""
            echo "git push"
            echo '```'
            echo ""
            echo "Docs: https://github.com/cad0p/semver-calver-release#draft-changelog-prs"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::Release PR contains unexpected files: $UNEXPECTED — fix runbook above and in the job summary"
          exit 1
        fi
        
        # Update PR title to match current version
        PR_NUMBER="${{ github.event.pull_request.number }}"
        if [ -n "$PR_NUMBER" ]; then
          gh pr edit "$PR_NUMBER" --title "chore(release): v$CURRENT_VERSION" 2>/dev/null || true
          echo "Updated PR title to: chore(release): v$CURRENT_VERSION"
        fi
