name: 'Validate Release PR'
description: 'Ensure package.json version is bumped before merging a release PR, and update PR title'

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Validate version bump and update PR title
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        BRANCH="${{ github.head_ref }}"
        
        # Only validate release/* branches
        if ! echo "$BRANCH" | grep -q '^release/from-v'; then
          echo "Not a release branch — skipping validation"
          exit 0
        fi
        
        CURRENT_VERSION=$(jq -r '.version' package.json)
        
        # Get the last released base version from main's package.json
        MAIN_VERSION=$(git show origin/main:package.json 2>/dev/null | jq -r '.version' || echo "0.0.0")
        MAIN_BASE=$(echo "$MAIN_VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
        
        echo "Last released base version: $MAIN_BASE"
        echo "Current version: $CURRENT_VERSION"
        
        if [ "$CURRENT_VERSION" = "$MAIN_BASE" ]; then
          sed -e "s|{{BRANCH}}|$BRANCH|g" \
              -e "s|{{MAIN_BASE}}|$MAIN_BASE|g" \
              "${{ github.action_path }}/errors/no-version-bump.md" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error::package.json version ($CURRENT_VERSION) must be bumped from the last released base version ($MAIN_BASE) — fix runbook above and in the job summary"
          exit 1
        fi
        
        echo "Version bumped: $MAIN_BASE → $CURRENT_VERSION"
        
        # Validate CHANGELOG.md has a dated heading for the release
        if [ -f CHANGELOG.md ]; then
          TOP_HEADING=$(awk '/^## \[/ { print; exit }' CHANGELOG.md)
          if ! echo "$TOP_HEADING" | grep -qE "^## \[$CURRENT_VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}"; then
            echo "::error::CHANGELOG.md top section is missing a release date"
            echo "::error::Expected: ## [$CURRENT_VERSION] - YYYY-MM-DD"
            echo "::error::Found: $TOP_HEADING"
            echo "::error::Mark this PR as 'Ready for review' to automatically add the date, or add it manually"
            exit 1
          fi
        fi
        
        # Prevent code changes from being hidden in release PRs
        UNEXPECTED=$(git diff --name-only origin/main...HEAD | grep -v -E '^(package\.json|package-lock\.json|yarn\.lock|pnpm-lock\.yaml|CHANGELOG\.md)$' || true)
        if [ -n "$UNEXPECTED" ]; then
          # sed replacement strings can't safely carry newlines, so inject
          # the multi-line file list with sed's `r` command from a temp file
          # (portable across GNU and BSD sed).
          UNEXPECTED_TMP=$(mktemp)
          printf '%s\n' "$UNEXPECTED" > "$UNEXPECTED_TMP"
          sed -e "/{{UNEXPECTED_FILES}}/r $UNEXPECTED_TMP" \
              -e "/{{UNEXPECTED_FILES}}/d" \
              -e "s|{{BRANCH}}|$BRANCH|g" \
              "${{ github.action_path }}/errors/unexpected-files.md" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f "$UNEXPECTED_TMP"
          echo "::error::Release PR contains unexpected files: $UNEXPECTED — fix runbook above and in the job summary"
          exit 1
        fi
        
        # Update PR title to match current version
        PR_NUMBER="${{ github.event.pull_request.number }}"
        if [ -n "$PR_NUMBER" ]; then
          gh pr edit "$PR_NUMBER" --title "chore(release): v$CURRENT_VERSION" 2>/dev/null || true
          echo "Updated PR title to: chore(release): v$CURRENT_VERSION"
        fi
